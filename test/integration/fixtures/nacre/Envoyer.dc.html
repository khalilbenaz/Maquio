<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nacre · Paiements</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F5F7; color: #0B0C10; font-family: Geist, system-ui, sans-serif">
  <div style="box-sizing: border-box; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Paiements</h1>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
        <a href="{{m.href}}" style="height: 92px; border-radius: 20px; background: #FFFFFF; text-decoration: none; color: #0B0C10; display: flex; flex-direction: column; justify-content: space-between; padding: 14px; box-sizing: border-box">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4338FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"></path></svg><span style="font-size: 14px; font-weight: 600">{{m.label}}</span></a>
      </sc-for>
    </div>
    <label for="who" style="position: absolute; left: -9999px">Nom, téléphone ou IBAN</label>
    <input id="who" placeholder="Nom, téléphone ou IBAN" style="height: 48px; box-sizing: border-box; border: 0; border-radius: 24px; background: #FFFFFF; padding: 0 18px; font-family: Geist, sans-serif; font-size: 15px; color: #0B0C10; outline: none">
    <div style="font-size: 13px; font-weight: 700; color: #6B6F7B; padding: 0 4px">RÉCENTS</div>
    <div style="display: flex; gap: 14px">
      <sc-for list="{{recent}}" as="r" hint-placeholder-count="4">
        <a href="Montant.dc.html" style="width: 70px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #0B0C10; font-size: 12px; font-weight: 600">
          <span style="width: 56px; height: 56px; border-radius: 28px; background: {{r.bg}}; color: {{r.fg}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px">{{r.ini}}</span>{{r.name}}</a>
      </sc-for>
    </div>
    <div style="font-size: 13px; font-weight: 700; color: #6B6F7B; padding: 0 4px">BÉNÉFICIAIRES</div>
    <section style="border-radius: 22px; background: #FFFFFF; padding: 4px 16px">
      <sc-for list="{{benef}}" as="b" hint-placeholder-count="4">
        <a href="Montant.dc.html" style="height: 62px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #0B0C10; border-bottom: {{b.border}}">
          <span style="width: 40px; height: 40px; border-radius: 20px; background: #F1F1F4; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">{{b.ini}}</span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{b.name}}</span><span style="font-size: 13px; color: #6B6F7B">{{b.iban}}</span></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B9BCC6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </sc-for>
    </section>
  </div>
  <div style="position: absolute; left: 0; bottom: 0"><dc-import name="TabBar" active="pay" hint-size="390px,96px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const modes = [['Virement', 'Montant.dc.html', 'M5 12h14M13 6l6 6-6 6'], ['Demander', 'Envoyer.dc.html', 'M19 12H5M11 6l-6 6 6 6'], ['Change', 'Change.dc.html', 'M7 7h13l-3-3M17 17H4l3 3']].map(([label, href, d]) => ({ label, href, d }));
    const recent = [['Léa', 'LM', '#E8EAFE', '#4338FF'], ['Yanis', 'YB', '#E3F5EC', '#0B8A5C'], ['Maman', 'MA', '#FFF1E6', '#B4501F'], ['Coloc', 'CO', '#F1F1F4', '#4A4E5A']].map(([name, ini, bg, fg]) => ({ name, ini, bg, fg }));
    const b = [['Léa Martin', 'FR76 ···· 0912', 'LM'], ['Yanis Benali', 'FR76 ···· 3381', 'YB'], ['Propriétaire', 'FR76 ···· 7744', 'PR'], ['Club de sport', 'FR76 ···· 1206', 'CS']];
    return { modes, recent, benef: b.map(([name, iban, ini], i) => ({ name, iban, ini, border: i < b.length - 1 ? '1px solid #F0F1F4' : '0' })) };
  }
}
</script>
</body>
</html>
