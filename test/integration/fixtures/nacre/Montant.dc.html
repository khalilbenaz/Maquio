<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nacre · Montant</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 32px; background: #F4F5F7; color: #0B0C10; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">
  <header style="display: flex; align-items: center; gap: 12px">
    <a href="Envoyer.dc.html" aria-label="Retour" style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B0C10" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <span style="width: 40px; height: 40px; border-radius: 20px; background: #E8EAFE; color: #4338FF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px">LM</span>
    <span style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700">Léa Martin</span><span style="font-size: 13px; color: #6B6F7B">FR76 ···· 0912 · instantané</span></span>
  </header>
  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
    <span style="font-size: 64px; font-weight: 800; letter-spacing: -0.03em">45<span style="color: #B9BCC6">,00</span> €</span>
    <span style="height: 32px; padding: 0 14px; border-radius: 16px; background: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; color: #4A4E5A">Solde : 4 218,54 € · Principal</span>
    <label for="motif" style="position: absolute; left: -9999px">Motif</label>
    <input id="motif" value="Restaurant samedi" style="margin-top: 10px; width: 240px; height: 40px; border: 0; border-radius: 20px; background: #FFFFFF; text-align: center; font-family: Geist, sans-serif; font-size: 14px; color: #0B0C10; outline: none">
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12"><button type="button" aria-label="{{k.aria}}" style="height: 60px; border: 0; background: transparent; font-family: Geist, sans-serif; font-size: 26px; font-weight: 500; color: #0B0C10">{{k.label}}</button></sc-for>
  </div>
  <a href="Recap.dc.html" style="height: 56px; border-radius: 28px; background: #4338FF; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Continuer</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { keys: ['1','2','3','4','5','6','7','8','9',',','0','⌫'].map((k) => ({ label: k, aria: k === '⌫' ? 'Effacer' : k === ',' ? 'Virgule' : k })) };
  }
}
</script>
</body>
</html>
