<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nacre · Cartes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F5F7; color: #0B0C10; font-family: Geist, system-ui, sans-serif">
  <div style="box-sizing: border-box; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; justify-content: space-between; align-items: center"><h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Cartes</h1>
      <button type="button" aria-label="Nouvelle carte" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B0C10" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div>
    <div style="position: relative; height: 214px">
      <div style="position: absolute; left: 26px; right: -40px; top: 0; height: 200px; border-radius: 22px; background: #4338FF; opacity: 0.35"></div>
      <div style="position: absolute; left: 0; right: 14px; top: 10px; height: 204px; border-radius: 22px; background: #0B0C10; color: #FFFFFF; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; justify-content: space-between">
        <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-weight: 800; font-size: 18px">nacre</span><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #B9BCC6">VIRTUELLE</span></div>
        <span style="width: 40px; height: 30px; border-radius: 6px; background: #3A3D47"></span>
        <div style="display: flex; justify-content: space-between; align-items: flex-end"><span style="font-size: 18px; font-weight: 600; letter-spacing: 0.14em">•••• 7310</span><span style="font-size: 13px; color: #B9BCC6">09/29</span></div>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{acts}}" as="a" hint-placeholder-count="4">
        <button type="button" style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: Geist, sans-serif; font-size: 12px; font-weight: 600; color: #0B0C10">
          <span style="{{a.circle}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{a.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.d}}"></path></svg></span>{{a.label}}</button>
      </sc-for>
    </div>
    <section style="border-radius: 22px; background: #FFFFFF; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; font-size: 15px"><span style="font-weight: 600">Plafond de paiement mensuel</span><span style="font-weight: 700">1 284 / 2 500 €</span></div>
      <div style="height: 8px; border-radius: 4px; background: #E6E7EB"><div style="width: 51%; height: 8px; border-radius: 4px; background: #4338FF"></div></div>
    </section>
    <section style="border-radius: 22px; background: #FFFFFF; padding: 4px 16px">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
        <div style="height: 56px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; border-bottom: {{o.border}}"><span style="font-weight: 500">{{o.label}}</span>
          <span role="switch" aria-checked="{{o.on}}" aria-label="{{o.label}}" style="{{o.track}}"><span style="{{o.knob}}"></span></span></div>
      </sc-for>
    </section>
  </div>
  <div style="position: absolute; left: 0; bottom: 0"><dc-import name="TabBar" active="cards" hint-size="390px,96px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const acts = [['Geler', 'M12 2v20M4 6l16 12M20 6L4 18', true], ['Détails', 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z', false], ['PIN', 'M6 10V8a6 6 0 0 1 12 0v2M5 10h14v11H5z', false], ['Réglages', 'M4 6h16M4 12h16M4 18h16M8 4v4M16 10v4M10 16v4', false]].map(([label, d, hi]) => ({
      label, d, ink: hi ? '#FFFFFF' : '#0B0C10',
      circle: 'width: 52px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; background: ' + (hi ? '#4338FF' : '#FFFFFF'),
    }));
    const o = [['Paiements sans contact', true], ['Paiements en ligne', true], ['Retraits à l’étranger', false]];
    const opts = o.map(([label, on], i) => ({
      label, on: on ? 'true' : 'false', border: i < o.length - 1 ? '1px solid #F0F1F4' : '0',
      track: 'width: 48px; height: 28px; border-radius: 14px; position: relative; display: inline-block; background: ' + (on ? '#4338FF' : '#D6D8DE'),
      knob: 'position: absolute; top: 3px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; left: ' + (on ? '23px' : '3px'),
    }));
    return { acts, opts };
  }
}
</script>
</body>
</html>
