<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nacre · Coffres d’épargne</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F5F7; color: #0B0C10; font-family: Geist, system-ui, sans-serif">
  <div style="box-sizing: border-box; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Coffres</h1>
    <section style="border-radius: 24px; background: #0B0C10; color: #FFFFFF; padding: 20px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; color: #B9BCC6; font-weight: 600">Épargne totale</span><span style="font-size: 34px; font-weight: 800; letter-spacing: -0.02em">2 894,36 €</span>
      <span style="font-size: 13px; color: #9BE3C4; font-weight: 600">+12,40 € d’intérêts ce mois · 3 % par an</span>
    </section>
    <sc-for list="{{vaults}}" as="v" hint-placeholder-count="3">
      <a href="Coffres.dc.html" style="border-radius: 22px; background: #FFFFFF; padding: 16px; text-decoration: none; color: #0B0C10; display: flex; flex-direction: column; gap: 12px">
        <span style="display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; border-radius: 14px; background: {{v.bg}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{v.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{v.d}}"></path></svg></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">{{v.name}}</span><span style="font-size: 13px; color: #6B6F7B">{{v.meta}}</span></span><span style="font-size: 16px; font-weight: 700">{{v.amount}}</span></span>
        <span style="height: 8px; border-radius: 4px; background: #F0F1F4"><span style="display: block; height: 8px; border-radius: 4px; width: {{v.p}}; background: {{v.fg}}"></span></span>
      </a>
    </sc-for>
    <a href="Coffres.dc.html" style="height: 54px; border-radius: 27px; background: #E8EAFE; color: #4338FF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Créer un coffre</a>
  </div>
  <div style="position: absolute; left: 0; bottom: 0"><dc-import name="TabBar" active="vaults" hint-size="390px,96px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const v = [['Voyage Lisbonne', 'Objectif 2 500 € · juin', '1 640,00 €', '66%', '#E8EAFE', '#4338FF', 'M2 16l20-7-9 13-2-6zM11 16l-3 5'], ['Fonds d’urgence', 'Arrondi des achats activé', '1 104,36 €', '55%', '#E3F5EC', '#0B8A5C', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z'], ['Nouveau vélo', 'Objectif 900 € · mars', '150,00 €', '17%', '#FFF1E6', '#B4501F', 'M5 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM5 14l4-7h6l4 7M9 7l3 7']];
    return { vaults: v.map(([name, meta, amount, p, bg, fg, d]) => ({ name, meta, amount, p, bg, fg, d })) };
  }
}
</script>
</body>
</html>
