<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nacre · Code d’accès</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 88px 28px 40px; background: #F4F5F7; color: #0B0C10; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 28px">
  <div style="width: 64px; height: 64px; border-radius: 32px; background: #0B0C10; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">CM</div>
  <div style="text-align: center; display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 24px; font-weight: 700">Bonjour Camille</h1><p style="margin: 0; font-size: 15px; color: #6B6F7B">Saisissez votre code d’accès</p></div>
  <div aria-label="2 chiffres saisis sur 4" style="display: flex; gap: 18px; padding: 8px 0"><span style="width: 14px; height: 14px; border-radius: 7px; background: #0B0C10"></span><span style="width: 14px; height: 14px; border-radius: 7px; background: #0B0C10"></span><span style="width: 14px; height: 14px; border-radius: 7px; box-shadow: inset 0 0 0 2px #B9BCC6"></span><span style="width: 14px; height: 14px; border-radius: 7px; box-shadow: inset 0 0 0 2px #B9BCC6"></span></div>
  <div style="margin-top: auto; width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 10px">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button type="button" aria-label="{{k.aria}}" style="height: 72px; border: 0; background: transparent; font-family: Geist, sans-serif; font-size: 28px; font-weight: 500; color: #0B0C10; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{k.isIcon}}" hint-placeholder-val="{{ false }}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0B0C10" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{k.d}}"></path></svg></sc-if>
        <sc-if value="{{k.isText}}" hint-placeholder-val="{{ true }}">{{k.label}}</sc-if>
      </button>
    </sc-for>
  </div>
  <a href="Main.dc.html" style="font-size: 15px; font-weight: 600; color: #4338FF; text-decoration: none">Code oublié ?</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const face = 'M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3M9 9v1M15 9v1M12 9v4h-1M9 16c2 1.5 4 1.5 6 0';
    const back = 'M21 5H9l-6 7 6 7h12zM16 10l-4 4M12 10l4 4';
    const keys = ['1','2','3','4','5','6','7','8','9','face','0','back'].map((k) => ({
      label: k, isIcon: k === 'face' || k === 'back', isText: !(k === 'face' || k === 'back'),
      d: k === 'face' ? face : back, aria: k === 'face' ? 'Reconnaissance faciale' : k === 'back' ? 'Effacer' : k,
    }));
    return { keys };
  }
}
</script>
</body>
</html>
