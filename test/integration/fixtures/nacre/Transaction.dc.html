<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nacre · Détail d’une opération</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 32px; background: #F4F5F7; color: #0B0C10; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Fermer" style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B0C10" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <button type="button" aria-label="Partager le justificatif" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B0C10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13M7 8l5-5 5 5M5 14v6h14v-6"></path></svg></button>
  </header>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0 6px">
    <span style="width: 64px; height: 64px; border-radius: 32px; background: #FFF1E6; color: #B4501F; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px">CL</span>
    <span style="font-size: 17px; font-weight: 600">Café Lumière</span>
    <span style="font-size: 40px; font-weight: 800; letter-spacing: -0.02em">−4,20 €</span>
    <span style="font-size: 14px; color: #6B6F7B">Aujourd’hui à 08:42</span>
  </div>
  <section style="border-radius: 22px; background: #FFFFFF; padding: 4px 16px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="height: 52px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; border-bottom: {{r.border}}"><span style="color: #6B6F7B">{{r.k}}</span><span style="font-weight: 600">{{r.v}}</span></div>
    </sc-for>
  </section>
  <section style="border-radius: 22px; background: #FFFFFF; padding: 16px; display: flex; align-items: center; gap: 12px">
    <span style="width: 40px; height: 40px; border-radius: 12px; background: #FFF1E6; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B4501F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 10h1a3 3 0 0 1 0 6h-1M8 3v3M12 3v3"></path></svg></span>
    <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Restauration</span><span style="font-size: 13px; color: #6B6F7B">142 € ce mois-ci · 12 opérations</span></span>
    <span style="font-size: 14px; font-weight: 600; color: #4338FF">Modifier</span>
  </section>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: auto">
    <button type="button" style="height: 52px; border: 0; border-radius: 26px; background: #FFFFFF; font-family: Geist, sans-serif; font-size: 15px; font-weight: 600; color: #0B0C10">Partager la note</button>
    <button type="button" style="height: 52px; border: 0; border-radius: 26px; background: #FFFFFF; font-family: Geist, sans-serif; font-size: 15px; font-weight: 600; color: #D93644">Signaler un problème</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = [['Statut', 'Effectuée'], ['Carte', 'Virtuelle ···· 7310'], ['Compte', 'Principal · EUR'], ['Lieu', 'Paris 11e'], ['Référence', 'NC-8F2K-4421']];
    return { rows: d.map(([k, v], i) => ({ k, v, border: i < d.length - 1 ? '1px solid #F0F1F4' : '0' })) };
  }
}
</script>
</body>
</html>
