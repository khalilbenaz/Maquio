<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nacre · Accueil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B0C10}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F5F7; color: #0B0C10; font-family: Geist, system-ui, sans-serif">
  <div style="height: 748px; overflow: hidden; box-sizing: border-box; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 22px">
    <header style="display: flex; align-items: center; gap: 12px">
      <a href="Profil.dc.html" aria-label="Profil" style="width: 40px; height: 40px; border-radius: 20px; background: #0B0C10; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; text-decoration: none">CM</a>
      <a href="Historique.dc.html" style="flex-grow: 1; height: 40px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: #6B6F7B; font-size: 15px; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6F7B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg>Rechercher</a>
      <a href="Notifications.dc.html" aria-label="Notifications, 2 nouvelles" style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; position: relative">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B0C10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"></path></svg>
        <span style="position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span></a>
    </header>

    <section aria-label="Solde" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 10px">
      <a href="Comptes.dc.html" style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #4A4E5A; text-decoration: none">Principal · EUR
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4A4E5A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
      <div style="font-size: 48px; font-weight: 800; letter-spacing: -0.03em">4 218<span style="font-size: 30px">,54 €</span></div>
      <a href="Comptes.dc.html" style="height: 34px; padding: 0 16px; border-radius: 17px; background: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; text-decoration: none">Comptes</a>
    </section>

    <nav aria-label="Actions rapides" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{actions}}" as="a" hint-placeholder-count="4">
        <a href="{{a.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; font-size: 13px; font-weight: 600; color: #0B0C10">
          <span style="width: 52px; height: 52px; border-radius: 26px; background: {{a.bg}}; display: flex; align-items: center; justify-content: center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{a.ink}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.d}}"></path></svg></span>{{a.label}}</a>
      </sc-for>
    </nav>

    <section aria-label="Dernières opérations" style="border-radius: 24px; background: #FFFFFF; padding: 8px 16px 6px">
      <sc-for list="{{tx}}" as="t" hint-placeholder-count="4">
        <a href="Transaction.dc.html" style="height: 62px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #0B0C10; border-bottom: {{t.border}}">
          <span style="width: 40px; height: 40px; border-radius: 20px; background: {{t.bg}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex: 0 0 auto">{{t.ini}}</span>
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{t.name}}</span><span style="font-size: 13px; color: #6B6F7B">{{t.when}}</span></span>
          <span style="font-size: 15px; font-weight: 600; color: {{t.amountInk}}">{{t.amount}}</span>
        </a>
      </sc-for>
      <a href="Historique.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: {{accent}}; text-decoration: none">Tout voir</a>
    </section>

    <section aria-label="Ce mois-ci" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <a href="Depenses.dc.html" style="border-radius: 22px; background: #FFFFFF; padding: 16px; text-decoration: none; color: #0B0C10; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; color: #6B6F7B; font-weight: 600">Dépensé en oct.</span><span style="font-size: 22px; font-weight: 800">1 284 €</span>
        <span style="display: flex; align-items: flex-end; gap: 4px; height: 34px"><span style="width: 10px; height: 14px; border-radius: 3px; background: #DCDDF9"></span><span style="width: 10px; height: 22px; border-radius: 3px; background: #DCDDF9"></span><span style="width: 10px; height: 18px; border-radius: 3px; background: #DCDDF9"></span><span style="width: 10px; height: 30px; border-radius: 3px; background: {{accent}}"></span><span style="width: 10px; height: 12px; border-radius: 3px; background: #DCDDF9"></span><span style="width: 10px; height: 26px; border-radius: 3px; background: #DCDDF9"></span></span></a>
      <a href="Coffres.dc.html" style="border-radius: 22px; background: #0B0C10; color: #FFFFFF; padding: 16px; text-decoration: none; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; color: #B9BCC6; font-weight: 600">Coffre Voyage</span><span style="font-size: 22px; font-weight: 800">1 640 €</span>
        <span style="height: 6px; border-radius: 3px; background: #2C2E36"><span style="display: block; width: 66%; height: 6px; border-radius: 3px; background: #FFFFFF"></span></span><span style="font-size: 12px; color: #B9BCC6">66 % de 2 500 €</span></a>
    </section>
  </div>
  <div style="position: absolute; left: 0; bottom: 0"><dc-import name="TabBar" active="home" hint-size="390px,96px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4338FF","options":["#4338FF","#0B8A5C","#E0522D","#0B0C10"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#4338FF';
    const actions = [
      ['Ajouter', 'Comptes.dc.html', 'M12 5v14M5 12h14', accent, '#FFFFFF'],
      ['Envoyer', 'Envoyer.dc.html', 'M5 12h14M13 6l6 6-6 6', '#FFFFFF', '#0B0C10'],
      ['Change', 'Change.dc.html', 'M7 7h13l-3-3M17 17H4l3 3', '#FFFFFF', '#0B0C10'],
      ['Plus', 'Profil.dc.html', 'M5 12h.01M12 12h.01M19 12h.01', '#FFFFFF', '#0B0C10'],
    ].map(([label, href, d, bg, ink]) => ({ label, href, d, bg, ink }));
    const rows = [
      ['Café Lumière', 'Aujourd’hui, 08:42 · Restauration', '−4,20 €', 'CL', '#FFF1E6', '#B4501F', false],
      ['Salaire Atelier Nord', 'Hier · Virement reçu', '+2 850,00 €', 'AN', '#E3F5EC', '#0B8A5C', true],
      ['Métro', 'Hier · Transport', '−2,10 €', 'M', '#E8EAFE', '#4338FF', false],
      ['Épicerie du Coin', 'Lun. · Courses', '−36,75 €', 'EC', '#F1F1F4', '#4A4E5A', false],
    ];
    const tx = rows.map(([name, when, amount, ini, bg, fg, pos], i) => ({ name, when, amount, ini, bg, fg, amountInk: pos ? '#0B8A5C' : '#0B0C10', border: i < rows.length - 1 ? '1px solid #F0F1F4' : '0' }));
    return { accent, actions, tx };
  }
}
</script>
</body>
</html>
