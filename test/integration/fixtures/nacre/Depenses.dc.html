<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nacre · Analyse des dépenses</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F5F7; color: #0B0C10; font-family: Geist, system-ui, sans-serif">
  <div style="box-sizing: border-box; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <header style="display: flex; align-items: center; justify-content: space-between">
      <a href="Main.dc.html" aria-label="Retour" style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B0C10" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
      <h1 style="margin: 0; font-size: 18px; font-weight: 700">Dépenses</h1><span style="width: 40px"></span>
    </header>
    <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; color: #6B6F7B; font-weight: 600">Octobre</span><span style="font-size: 36px; font-weight: 800; letter-spacing: -0.02em">1 284,00 €</span><span style="font-size: 13px; font-weight: 600; color: #0B8A5C">−8 % par rapport à septembre</span></div>
    <section aria-label="Dépenses par semaine" style="border-radius: 22px; background: #FFFFFF; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; height: 120px">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="6">
          <span style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: #6B6F7B"><span style="width: 30px; height: {{b.h}}; border-radius: 8px; background: {{b.c}}"></span>{{b.l}}</span>
        </sc-for>
      </div>
    </section>
    <section aria-label="Par catégorie" style="border-radius: 22px; background: #FFFFFF; padding: 4px 16px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
        <div style="height: 58px; display: flex; align-items: center; gap: 12px; border-bottom: {{c.border}}">
          <span style="width: 12px; height: 12px; border-radius: 6px; background: {{c.color}}"></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px"><span style="display: flex; justify-content: space-between; font-size: 15px"><span style="font-weight: 600">{{c.name}}</span><span style="font-weight: 700">{{c.amount}}</span></span>
            <span style="height: 5px; border-radius: 3px; background: #F0F1F4"><span style="display: block; height: 5px; border-radius: 3px; width: {{c.w}}; background: {{c.color}}"></span></span></span>
        </div>
      </sc-for>
    </section>
  </div>
  <div style="position: absolute; left: 0; bottom: 0"><dc-import name="TabBar" active="home" hint-size="390px,96px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const bars = [['S36', 60], ['S37', 84], ['S38', 52], ['S39', 96], ['S40', 70], ['S41', 34]].map(([l, h], i) => ({ l, h: h + 'px', c: i === 3 ? '#4338FF' : '#DCDDF9' }));
    const c = [['Logement', '520 €', 41, '#4338FF'], ['Courses', '286 €', 22, '#0B8A5C'], ['Restauration', '142 €', 11, '#E0522D'], ['Transport', '96 €', 7, '#6B6F7B'], ['Loisirs', '240 €', 19, '#0B0C10']];
    return { bars, cats: c.map(([name, amount, w, color], i) => ({ name, amount, w: w + '%', color, border: i < c.length - 1 ? '1px solid #F0F1F4' : '0' })) };
  }
}
</script>
</body>
</html>
